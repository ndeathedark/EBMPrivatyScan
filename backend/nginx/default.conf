# Límites de tasa a nivel de proxy (primera barrera; la API aplica los suyos)
limit_req_zone $binary_remote_addr zone=ebm_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ebm_audit:10m rate=6r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;

    # Encabezados de seguridad del frontend. CSP estricta: solo recursos propios,
    # sin scripts en línea ni CDN de terceros.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Activar solo cuando el sitio se sirva exclusivamente por HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\. { deny all; }

    location = /api/v1/audit/quick {
        limit_req zone=ebm_audit burst=3 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_read_timeout 75s;
    }

    location /api/ {
        limit_req zone=ebm_api burst=20 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
