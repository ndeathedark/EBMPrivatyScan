name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias (versiones bloqueadas, solo binarios, verificadas por hash)
        # requirements-dev.txt incluye las dependencias de la app y las herramientas de prueba.
        # --only-binary evita ejecutar scripts de instalación de paquetes fuente.
        run: pip install --only-binary=:all: --require-hashes -r backend/requirements-dev.txt
      - name: Pruebas automatizadas
        working-directory: backend
        run: python -m pytest -q
      - name: Auditoría de dependencias vulnerables
        run: pip-audit -r backend/requirements-dev.txt --require-hashes --disable-pip
